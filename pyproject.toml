[project]
name = "jepa-risk-detection"
version = "0.1.0"
description = "Phase 1 experiments for V-JEPA 2 traffic anomaly detection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "pyarrow>=15,<23",
  "pillow>=10,<12",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "torch>=2.4,<3",
  "transformers>=4.53,<5",
  "torchvision>=0.24,<1",
  "av>=12,<16",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jepa_risk"]

[tool.pytest.ini_options]
markers = [
  "gpu: requires a CUDA or MPS-capable torch runtime",
]
testpaths = ["tests"]
